<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>wsc</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #181825;
      border-bottom: 1px solid #313244;
    }

    header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #89dceb;
      letter-spacing: 0.05em;
    }

    #server-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #313244;
      color: #a6adc8;
    }
    #server-badge.online  { background: #a6e3a1; color: #1e1e2e; }
    #server-badge.offline { background: #f38ba8; color: #1e1e2e; }

    main { padding: 12px 14px; }

    #url-box {
      background: #181825;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      color: #a6adc8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }

    #label {
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #313244;
      background: #181825;
      color: #cdd6f4;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
    }
    #label:focus { border-color: #89dceb; }
    #label::placeholder { color: #585b70; }

    .device-options {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    .capture-mode {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
    }

    .device-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a6adc8;
      cursor: pointer;
      user-select: none;
    }

    .device-option input {
      accent-color: #89dceb;
    }

    #capture-btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      background: #89dceb;
      color: #1e1e2e;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #capture-btn:hover:not(:disabled) { opacity: 0.85; }
    #capture-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    #status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #a6adc8;
      line-height: 1.5;
    }
    #status.success { color: #a6e3a1; }
    #status.error   { color: #f38ba8; }
    #status.loading { color: #f9e2af; }

    #progress {
      display: none;
      margin-top: 8px;
      height: 3px;
      background: #313244;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress.active { display: block; }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: #89dceb;
      transition: width 0.3s;
      border-radius: 2px;
    }

    #gallery-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      background: transparent;
      border: 1px solid #313244;
      color: #89dceb;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    #gallery-link:hover { background: #313244; border-color: #89dceb; }
  </style>
</head>
<body>
  <header>
    <h1>📸 wsc</h1>
    <div style="display: flex; align-items: center; gap: 8px;">
      <a id="gallery-link" href="#" target="_blank">🖼️ ギャラリー</a>
      <span id="server-badge">確認中...</span>
    </div>
  </header>

  <main>
    <div id="url-box" title="">読み込み中...</div>

    <input type="text" id="label" placeholder="ラベル（任意）" maxlength="80">

    <div class="device-options" aria-label="対象デバイス">
      <label class="device-option"><input type="checkbox" id="device-pc" checked> PC</label>
      <label class="device-option"><input type="checkbox" id="device-mobile" checked> モバイル</label>
    </div>

    <div class="capture-mode" aria-label="キャプチャモード">
      <label class="device-option"><input type="checkbox" id="window-size"> ウィンドウサイズ制限</label>
    </div>

    <button id="capture-btn" disabled>選択デバイスをキャプチャ</button>

    <div id="progress"><div id="progress-bar"></div></div>
    <div id="status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
